<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Companion</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #fff7f2;
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  .phone {
    max-width: 420px; height: 100vh; margin: 0 auto; background: #fff;
    display: flex; flex-direction: column;
  }
  header {
    padding: 10px 14px 8px; text-align: center; font-size: 12px; color: #241f28;
    border-bottom: 1px solid #ece4df; background: rgba(255, 247, 242, 0.92);
  }
  .avatar {
    width: 50px; height: 50px; margin: 0 auto 4px; border-radius: 50%;
    background: linear-gradient(135deg, #ff5b3a, #ff8a2b); color: #fff;
    font: 800 24px/50px -apple-system, "SF Pro Display", sans-serif;
  }
  #thread { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .bubble {
    max-width: 78%; padding: 8px 12px; border-radius: 18px;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .user { align-self: flex-end; background: #0a84ff; color: #fff; }
  .assistant { align-self: flex-start; background: #e9e9eb; color: #000; }
  .assistant a { color: #0a84ff; }
  .typing { align-self: flex-start; color: #8e8e93; font-size: 14px; padding: 4px 12px; }
  form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e5e5ea; }
  input {
    flex: 1; padding: 9px 14px; border: 1px solid #d1d1d6; border-radius: 20px;
    font: inherit; outline: none;
  }
  button {
    border: 0; border-radius: 50%; width: 38px; background: #0a84ff;
    color: #fff; font-size: 18px; cursor: pointer;
  }
</style>
</head>
<body>
<div class="phone">
  <header><div class="avatar">C</div>Companion &rsaquo;</header>
  <div id="thread"></div>
  <form id="composer">
    <input id="text" autocomplete="off" placeholder="Text Message" autofocus>
    <button aria-label="Send">&uarr;</button>
  </form>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const userId = params.get("user") || localStorage.getItem("userId") || "+15555550100";
  const secret = localStorage.getItem("bridgeSecret") || prompt("Bridge secret");
  localStorage.setItem("userId", userId);
  localStorage.setItem("bridgeSecret", secret);

  const thread = document.getElementById("thread");
  const headers = { "X-Bridge-Secret": secret, "Content-Type": "application/json" };
  let pending = null;

  function bubble(role, text) {
    const node = document.createElement("div");
    node.className = `bubble ${role}`;
    for (const part of text.split(/(https?:\/\/\S+)/)) {
      if (/^https?:\/\//.test(part)) {
        const link = document.createElement("a");
        link.href = part;
        link.target = "_blank";
        link.textContent = part;
        node.append(link);
      } else {
        node.append(part);
      }
    }
    return node;
  }

  async function refresh() {
    const response = await fetch(`/users/${encodeURIComponent(userId)}/transcript`, { headers });
    if (!response.ok) return;
    const lines = await response.json();
    thread.replaceChildren(...lines.map((line) => bubble(line.role, line.text)));
    if (pending) {
      const last = lines[lines.length - 1];
      if (!last || last.role !== "user" || last.text !== pending) {
        thread.append(bubble("user", pending));
      }
      const typing = document.createElement("div");
      typing.className = "typing";
      typing.textContent = "typing…";
      thread.append(typing);
    }
    thread.scrollTop = thread.scrollHeight;
  }

  document.getElementById("composer").addEventListener("submit", async (event) => {
    event.preventDefault();
    const input = document.getElementById("text");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    pending = text;
    await refresh();
    await fetch("/messages", {
      method: "POST",
      headers,
      body: JSON.stringify({ user_id: userId, text }),
    });
    pending = null;
    await refresh();
  });

  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
